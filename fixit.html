<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fixit — know what you need before you start</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #16181B;
    --surface: #202327;
    --surface-2: #262A2F;
    --line: #34393E;
    --orange: #E2542B;
    --brass: #B99456;
    --text: #ECE7DD;
    --muted: #8A9096;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 18px 80px; }

  header { margin-bottom: 24px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; background: var(--orange); color: #16181B;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px;
    border-radius: 6px; transform: rotate(-6deg);
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .tagline { color: var(--muted); font-size: 13.5px; margin-top: 4px; }

  .search-row {
    display: flex; gap: 8px; margin: 20px 0 16px;
  }
  .search-box {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
  }
  .search-box::placeholder { color: var(--muted); }

  .chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 22px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .chip.active {
    background: rgba(226,84,43,0.14);
    border-color: var(--orange);
    color: var(--orange);
  }

  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 16px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .card:hover, .card:active { border-color: var(--brass); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16.5px; }
  .card-meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .tag {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 5px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.02em;
  }
  .tag.cat { background: var(--surface-2); color: var(--muted); }
  .tag.diff-easy { background: rgba(153,190,120,0.15); color: #9BBE78; }
  .tag.diff-medium { background: rgba(226,166,43,0.15); color: #E2A62B; }
  .tag.diff-hard { background: rgba(226,84,43,0.15); color: var(--orange); }
  .chevron { color: var(--muted); font-size: 18px; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .big { font-size: 32px; margin-bottom: 10px; }

  /* Detail overlay */
  .overlay {
    position: fixed; inset: 0; background: var(--bg);
    z-index: 50; overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .detail-wrap { max-width: 640px; margin: 0 auto; padding: 20px 18px 60px; }
  .close-btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    width: 38px; height: 38px; border-radius: 10px; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    margin-bottom: 20px;
  }
  .detail-title {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px;
    margin: 0 0 8px;
  }
  .detail-meta { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 10px; margin-top: 28px;
  }
  .section-label:first-of-type { margin-top: 0; }

  /* Parts-slip tool list */
  .slip {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 16px;
  }
  .slip-item {
    display: flex; align-items: baseline; gap: 8px;
    padding: 13px 0;
    border-bottom: 1px dashed var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
  }
  .slip-item:last-child { border-bottom: none; }
  .slip-check {
    width: 18px; height: 18px; flex: 0 0 auto;
    border: 1.5px solid var(--muted);
    border-radius: 4px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    font-size: 12px;
  }
  .slip-check.checked {
    background: var(--orange); border-color: var(--orange); color: #16181B;
  }
  .slip-name { flex: 1; }
  .slip-item.checked .slip-name { color: var(--muted); text-decoration: line-through; }
  .slip-leader { flex: 1; border-bottom: 1px dotted var(--line); margin: 0 6px; height: 1px; align-self: center; }

  .materials-list { display: flex; flex-direction: column; gap: 8px; }
  .material-item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text);
  }

  .steps { counter-reset: step; display: flex; flex-direction: column; gap: 4px; }
  .step {
    counter-increment: step;
    display: flex; gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .step:last-child { border-bottom: none; }
  .step::before {
    content: counter(step);
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    color: var(--orange);
    font-size: 15px;
    flex: 0 0 auto;
    width: 24px; height: 24px;
    border: 1.5px solid var(--orange);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .step-text { font-size: 14.5px; line-height: 1.5; padding-top: 2px; }

  .safety-note {
    background: rgba(226,84,43,0.1);
    border: 1px solid rgba(226,84,43,0.3);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13.5px;
    line-height: 1.5;
    margin-top: 28px;
    color: var(--text);
  }
  .safety-note strong { color: var(--orange); }

  @media (prefers-reduced-motion: reduce) {
    .overlay { animation: none; }
  }
</style>
</head>

const CATEGORIES = ["All", ...Array.from(new Set(REPAIRS.map(r => r.category)))];

let state = {
  query: "",
  category: "All",
  openId: null,
  checked: loadChecked()
};

function loadChecked() {
  try {
    const raw = localStorage.getItem("fixit-checked");
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveChecked() {
  try {
    localStorage.setItem("fixit-checked", JSON.stringify(state.checked));
  } catch (e) {}
}

function toggleCheck(repairId, toolIndex) {
  const key = repairId + ":" + toolIndex;
  state.checked[key] = !state.checked[key];
  saveChecked();
  render();
}

function isChecked(repairId, toolIndex) {
  return !!state.checked[repairId + ":" + toolIndex];
}

function filteredRepairs() {
  const q = state.query.trim().toLowerCase();
  return REPAIRS.filter(r => {
    const matchesCategory = state.category === "All" || r.category === state.category;
    const matchesQuery = !q || r.title.toLowerCase().includes(q) || r.category.toLowerCase().includes(q);
    return matchesCategory && matchesQuery;
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderList() {
  const results = filteredRepairs();
  const app = document.getElementById("app");

  const chipsHtml = CATEGORIES.map(c =>
    `<button class="chip ${c === state.category ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
  ).join("");

  const cardsHtml = results.length
    ? results.map(r => `
        <div class="card" data-id="${r.id}">
          <div class="card-top">
            <div class="card-title">${escapeHtml(r.title)}</div>
            <div class="chevron">›</div>
          </div>
          <div class="card-meta">
            <span class="tag cat">${escapeHtml(r.category)}</span>
            <span class="tag diff-${r.difficulty}">${escapeHtml(r.difficulty)}</span>
            <span class="tag cat">${escapeHtml(r.time)}</span>
          </div>
        </div>
      `).join("")
    : `<div class="empty"><div class="big">🔧</div>No repairs match that search yet.</div>`;

  app.innerHTML = `
    <div class="wrap">
      <header>
        <div class="brand">
          <span class="mark">✓</span>
          <h1>Fixit</h1>
        </div>
        <div class="tagline">Know what you need before you start</div>
      </header>

      <div class="search-row">
        <input class="search-box" id="searchInput" type="text" placeholder="Search a repair..." value="${escapeHtml(state.query)}" />
      </div>

      <div class="chips">${chipsHtml}</div>

      <div class="card-list">${cardsHtml}</div>
    </div>
  `;

  document.getElementById("searchInput").addEventListener("input", (e) => {
    state.query = e.target.value;
    render();
  });

  document.querySelectorAll(".chip").forEach(el => {
    el.addEventListener("click", () => {
      state.category = el.dataset.cat;
      render();
    });
  });

  document.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      state.openId = el.dataset.id;
      render();
    });
  });
}

function renderDetail() {
  const repair = REPAIRS.find(r => r.id === state.openId);
  const app = document.getElementById("app");

  const toolsHtml = repair.tools.length
    ? repair.tools.map((t, i) => `
        <div class="slip-item ${isChecked(repair.id, i) ? 'checked' : ''}">
          <div class="slip-check ${isChecked(repair.id, i) ? 'checked' : ''}" data-tool-idx="${i}">${isChecked(repair.id, i) ? '✓' : ''}</div>
          <div class="slip-name">${escapeHtml(t)}</div>
        </div>
      `).join("")
    : `<div class="slip-item"><div class="slip-name" style="color:var(--muted)">No special tools needed</div></div>`;

  const materialsHtml = repair.materials.length
    ? repair.materials.map(m => `<div class="material-item">${escapeHtml(m)}</div>`).join("")
    : "";

  const stepsHtml = repair.steps.map(s => `
    <div class="step"><div class="step-text">${escapeHtml(s)}</div></div>
  `).join("");

  app.innerHTML = `
    <div class="overlay">
      <div class="detail-wrap">
        <button class="close-btn" id="closeBtn">✕</button>
        <h2 class="detail-title">${escapeHtml(repair.title)}</h2>
        <div class="detail-meta">
          <span class="tag cat">${escapeHtml(repair.category)}</span>
          <span class="tag diff-${repair.difficulty}">${escapeHtml(repair.difficulty)}</span>
          <span class="tag cat">${escapeHtml(repair.time)}</span>
        </div>

        <div class="section-label">Tools needed</div>
        <div class="slip">${toolsHtml}</div>

        ${materialsHtml ? `<div class="section-label">Materials</div><div class="materials-list">${materialsHtml}</div>` : ""}

        <div class="section-label">Steps</div>
        <div class="steps">${stepsHtml}</div>

        ${repair.safety ? `<div class="safety-note"><strong>Before you start:</strong> ${escapeHtml(repair.safety)}</div>` : ""}
      </div>
    </div>
  `;

  document.getElementById("closeBtn").addEventListener("click", () => {
    state.openId = null;
    render();
  });

  document.querySelectorAll(".slip-check").forEach(el => {
    el.addEventListener("click", () => {
      toggleCheck(repair.id, parseInt(el.dataset.toolIdx, 10));
    });
  });
}

function render() {
  if (state.openId) {
    renderDetail();
  } else {
    renderList();
  }
}

render();
</script>
